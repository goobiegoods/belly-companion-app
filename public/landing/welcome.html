<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>belly · you're in</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--night:#150A1F;--cream:#FBEEE0;--soft:rgba(251,238,224,.74);--faint:rgba(251,238,224,.52);--gold:#F2B647;--ember:#E8622E;
--serif:Fraunces,Georgia,serif;--sans:Inter,-apple-system,"Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--night);color:var(--cream);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:32px 16px;
 background:radial-gradient(120% 70% at 50% 0%,rgba(242,182,71,.28),transparent 60%),radial-gradient(90% 60% at 50% 100%,rgba(181,56,107,.32),transparent 70%),var(--night)}
.card{width:100%;max-width:400px;text-align:center}
.orb{width:84px;height:84px;margin:0 auto 26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE3A8,var(--gold) 45%,var(--ember));box-shadow:0 0 60px rgba(242,182,71,.5);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.95)}50%{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}}
.mono{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
h1{font-family:var(--serif);font-weight:400;font-size:36px;line-height:1.1;margin:10px 0 12px}
p{font-size:15px;font-weight:300;line-height:1.55;color:var(--soft);margin:0 auto 22px;max-width:32ch}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:54px;border:0;border-radius:14px;background:var(--cream);color:var(--night);font:600 16px var(--sans);text-decoration:none;cursor:pointer}
.ghost{display:block;margin:10px auto 0;background:none;border:0;color:var(--soft);font:500 14px var(--sans);padding:12px 18px;cursor:pointer}
.ghost:disabled{opacity:.6;cursor:default}
.note{margin-top:22px;font-size:12px;color:var(--faint)}
.note a{color:var(--soft)}
</style>
</head>
<body data-page="welcome">
<main class="card">
  <div class="orb" aria-hidden="true"></div>
  <span class="mono">your trial has started</span>
  <h1>You're in, mama.</h1>
  <p><b style="color:var(--cream);font-weight:500">Check your email</b> and tap <b style="color:var(--cream);font-weight:500">Open Belly</b>. That's your way in, no password needed. It can take a minute; check spam too.</p>
  <button class="ghost" id="resend" type="button">Didn't get it? Resend my link</button>
  <p class="note" id="msg" role="status" aria-live="polite"></p>
  <p class="note">Questions? <a href="mailto:hello@meetbelly.com">hello@meetbelly.com</a> · <a href="/terms">Terms</a> · <a href="/privacy">Privacy</a></p>
</main>
<script src="/landing/funnel.js"></script>
<script src="/landing/welcome.js"></script>
</body>
</html>
